<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Código QR</title>
    <!-- Cargamos la fuente Montserrat para mantener el diseño del proyecto anterior -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- Librería de generación local y segura -->
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f7f9fa;
            font-family: 'Montserrat', sans-serif;
        }

        .qr-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 90%;
            width: 360px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 16px;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .url-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 13px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-family: 'Montserrat', sans-serif;
        }

        .url-input:focus {
            border-color: #000000;
            outline: none;
        }

        .btn-generate {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .btn-generate:hover {
            background-color: #333333;
        }

        /* --- Panel del Indicador LED --- */
        .led-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            height: 24px;
        }

        .led-light {
            width: 12px;
            height: 12px;
            background-color: #cccccc; /* Gris por defecto */
            border-radius: 50%;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        /* Clase activa para encender el LED en verde */
        .led-active {
            background-color: #2e7d32 !important;
            box-shadow: 0 0 10px #2e7d32;
        }

        .led-text {
            font-size: 11px;
            font-weight: 700;
            color: #999999;
            transition: color 0.3s;
        }

        .text-active {
            color: #2e7d32 !important;
        }

        /* Área del QR */
        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            padding: 10px;
            background: #ffffff;
            min-height: 220px;
        }

        #qrcode img {
            width: 220px !important;
            height: 220px !important;
            display: block;
            margin: 0 auto;
        }

        /* Botón de descarga PDF */
        .btn-pdf {
            display: block;
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .btn-pdf:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="qr-container">
    <h2>Código QR de Validación</h2>
    
    <input type="text" id="urlInput" class="url-input" placeholder="Pega aquí la nueva URL del SAT..." value="https://sat.gob.mx">
    
    <button class="btn-generate" onclick="generarQR()">Generar Nuevo QR</button>
    
    <!-- Componente de Luz LED -->
    <div class="led-panel">
        <div id="ledLight" class="led-light"></div>
        <span id="ledText" class="led-text">ESPERANDO OPERACIÓN</span>
    </div>
    
    <div id="qrcode"></div>

    <!-- Botón para imprimir / descargar PDF -->
    <button id="pdfBtn" class="btn-pdf" onclick="abrirVentanaPDF()" style="display: none;">Descargar en PDF</button>
</div>

<script>
    let qrcodeInstance = null;

    function generarQR() {
        const urlText = document.getElementById("urlInput").value.trim();
        const qrDiv = document.getElementById("qrcode");
        const ledLight = document.getElementById("ledLight");
        const ledText = document.getElementById("ledText");
        const pdfBtn = document.getElementById("pdfBtn");

        if (!urlText) {
            alert("Por favor, ingresa una URL válida.");
            return;
        }

        // Reseteamos el contenedor y apagamos el LED un momento para simular proceso
        qrDiv.innerHTML = "";
        ledLight.classList.remove("led-active");
        ledText.classList.remove("text-active");
        ledText.innerText = "PROCESANDO...";
        pdfBtn.style.display = "none";

        setTimeout(() => {
            // Generación interna pura que no se bloquea en servidores HTTPS
            qrcodeInstance = new QRCode(qrDiv, {
                text: urlText,
                width: 250,
                height: 250,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Encendemos el LED en verde al finalizar con éxito
            ledLight.classList.add("led-active");
            ledText.classList.add("text-active");
            ledText.innerText = "¡QR GENERADO EXITOSAMENTE!";
            
            // Habilitamos el botón de PDF
            pdfBtn.style.display = "block";
        }, 200);
    }

    // Función para abrir el QR limpio en una ventana nueva y lanzar el guardado a PDF
    function abrirVentanaPDF() {
        const qrImg = document.getElementById("qrcode").querySelector("img");
        if (!qrImg) return;

        // Abrimos la nueva ventana independiente que solicitaste
        const ventanaPDF = window.open("", "_blank", "width=600,height=600");
        
        ventanaPDF.document.write(`
            <html>
            <head>
                <title>Exportar QR a PDF</title>
                <style>
                    body {
                        margin: 0;
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        font-family: sans-serif;
                        background: #ffffff;
                    }
                    img {
                        width: 300px;
                        height: 300px;
                    }
                    p {
                        margin-top: 20px;
                        font-size: 14px;
                        color: #666;
                    }
                    /* Oculta las instrucciones en la hoja impresa final */
                    @media print {
                        p { display: none; }
                    }
                </style>
            </head>
            <body>
                <img src="${qrImg.src}" />
                <p>Preparando documento... Si no abre automático, presiona Ctrl+P (o Cmd+P)</p>
                <script>
                    // Dispara el diálogo nativo para guardar como PDF en celular o PC
                    setTimeout(() => {
                        window.print();
                        window.close();
                    }, 300);
                <\/script>
            </body>
            </html>
        `);
        ventanaPDF.document.close();
    }

    // Inicialización automática
    window.onload = function() {
        generarQR();
    };
</script>

</body>
</html>
